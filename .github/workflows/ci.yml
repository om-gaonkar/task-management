name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/daymark_test
          SESSION_SECRET: 01234567890123456789012345678901
      - run: npm run build
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/daymark_test
          SESSION_SECRET: 01234567890123456789012345678901
      - run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/daymark_test
          SESSION_SECRET: 01234567890123456789012345678901
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
